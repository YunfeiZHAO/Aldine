# Aldine: the app image is built from this checkout; the compiler is pulled
# prebuilt (its TeX Live layers are ~1.4 GB and this source doesn't change it).
# Everything else (auth/SSO/AI/email options, TLS, Postgres/Redis) lives in
# docker-compose.full.yml. Both files share the same project name and volumes,
# so you can switch between them without losing data.
#   docker compose up -d --build      # rebuild the app after editing source
name: aldine

services:
  app:
    # Build the app (web + server) from this checkout instead of pulling the
    # published image, so local source changes appear. `image:` names what the
    # build is tagged as; `docker compose up -d --build` rebuilds it.
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ghcr.io/trahloff/aldine-app:${ALDINE_VERSION:-1.3.1}
    expose:
      - "3000"
    # NEW: Authentication configuration
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-}
      ALDINE_PUBLIC_URL: ${ALDINE_PUBLIC_URL:-}
      ALDINE_MCP: ${ALDINE_MCP:-}
      ALDINE_MCP_TOKEN: ${ALDINE_MCP_TOKEN:-}
      ALDINE_ADMIN_EMAILS: ${ALDINE_ADMIN_EMAILS:-}
      ALDINE_ALLOWED_EMAILS: ${ALDINE_ALLOWED_EMAILS:-}
      ALDINE_SIGNUP: ${ALDINE_SIGNUP:-}
    volumes:
      - aldine-data:/data
      - aldine-secrets:/secrets
    networks:
      - frontend
      - backend
      - dokploy-network
    init: true # reap orphaned git/compile children (node runs as PID 1 otherwise)
    restart: unless-stopped

  compiler:
    image: ghcr.io/trahloff/aldine-compiler:${ALDINE_VERSION:-1.3.1}${ALDINE_TEXLIVE:-}
    volumes:
      - aldine-data:/data
    # Hardening: no external egress (internal network), drop all Linux caps, no
    # privilege escalation, bounded memory and PIDs. Packages are baked into the
    # image at build time, so the compiler never needs the network. LaTeX
    # processes untrusted input; keep these. (docker-compose.full.yml adds a CPU
    # cap on top; it is left out here because `cpus:` above the host's core
    # count makes the container refuse to start.)
    networks:
      - backend
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    init: true # reap orphaned pdflatex/biber children left by killed latexmk runs
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    internal: true # the compiler has no route to the internet
  dokploy-network:
    external: true

volumes:
  aldine-data:
  aldine-secrets:
